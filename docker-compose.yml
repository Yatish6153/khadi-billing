# Optional: local PostgreSQL for development.
#   docker compose up -d
# Matches DATABASE_URL in backend/.env.example.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: khadi
      POSTGRES_PASSWORD: khadi
      POSTGRES_DB: khadi_billing
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
